name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-live
  cancel-in-progress: true

jobs:
  build:
    # workflow_dispatch can select any ref, so keep deployments limited to main.
    if: github.ref == 'refs/heads/main'
    environment:
      # The existing github-pages environment is stuck behind a stale protection gate.
      name: github-pages-live
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build site
        uses: actions/jekyll-build-pages@v1
        with:
          source: .
          destination: ./_site
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
