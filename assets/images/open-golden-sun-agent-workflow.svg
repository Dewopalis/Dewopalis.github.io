<text x="534" y="409" font-size="18" class="muted">Areas · events · battle · local packs</text>
<text x="534" y="439" font-size="18" class="muted">Session and save integration</text>
<path d="M720 470 V530" class="line"/>
<text x="737" y="506" font-size="15" class="muted">bounded tasks</text>
<rect x="976" y="340" width="416" height="130" rx="7" class="lead"/>
