<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1060" viewBox="0 0 1440 1060" role="img" aria-labelledby="title desc">
<title id="title">Open Golden Sun: autonomous delivery workflow</title>
<desc id="desc">A human supplies goals and limits to a coordinator. Three on-demand domains cover content and evidence, runtime and gameplay, and acceptance and tooling. Bounded workers use task-appropriate models and tools. A separate reviewer returns findings. Typical concurrency is a coordinator and two workers, with a reviewer taking a freed slot; maximum four active agents including coordinator.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b1c4b8"/></marker></defs>
<style>text{font-family:'DejaVu Sans',sans-serif;fill:#e6eee8} .title{font-family:'DejaVu Sans Condensed',sans-serif;font-weight:700;letter-spacing:.5px} .muted{fill:#acbeb3}.small{font-size:17px}.line{fill:none;stroke:#b1c4b8;stroke-width:1.7;marker-end:url(#arrow)} .box{fill:#10221b;stroke:#bacac1;stroke-width:1.6}.lead{fill:#183127;stroke:#5fc58f;stroke-width:2}.tool{fill:#1a2b23;stroke:#284438;stroke-width:1}.worker{fill:#0c1914;stroke:#bacac1;stroke-width:1.6}</style>
<rect width="1440" height="1060" rx="16" fill="#111f1b"/>

