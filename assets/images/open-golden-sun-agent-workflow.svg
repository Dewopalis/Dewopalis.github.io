<text x="534" y="565" font-size="21" class="title">BOUNDED WORKERS</text>
<text x="534" y="597" font-size="17" class="muted">Loaders · state · isolated patches</text>
<text x="534" y="628" font-size="18" class="">Small explicit changes → Luna</text>
<text x="534" y="657" font-size="18" class="">Cross-system integration → Sol</text>
<path d="M720 684 V760" class="line"/>
<rect x="976" y="530" width="416" height="154" rx="7" class="worker"/>
<text x="998" y="565" font-size="21" class="title">BOUNDED WORKERS</text>
<text x="998" y="597" font-size="17" class="muted">Replay · negative checks · diagnostics</text>
<text x="998" y="628" font-size="18" class="">Test / build execution → tools</text>
<text x="998" y="657" font-size="18" class="">Meaningful review → separate Sol</text>
<path d="M1184 684 V760" class="line"/>
<text x="70" y="722" font-size="15" class="muted">harvest / validate</text>
<text x="534" y="722" font-size="15" class="muted">integrate / check</text>
<text x="998" y="722" font-size="15" class="muted">measure / compare</text>
<rect x="48" y="760" width="416" height="126" rx="7" class="tool"/>
<text x="70" y="797" font-size="22" class="title">PINNED SOURCES</text>
<text x="70" y="830" font-size="18" class="muted">Alchemy + GSRecomp</text>
<text x="70" y="861" font-size="17" class="muted">Facts only; original content stays local</text>
<rect x="512" y="760" width="416" height="126" rx="7" class="tool"/>
<text x="534" y="797" font-size="22" class="title">INTEGRATION QUEUE</text>
<text x="534" y="830" font-size="18" class="muted">Isolated patches → combined checks</text>
<text x="534" y="861" font-size="17" class="muted">One integration writer per checkout</text>
<rect x="976" y="760" width="416" height="126" rx="7" class="tool"/>
<text x="998" y="797" font-size="22" class="title">REFERENCE &amp; CHECKS</text>
