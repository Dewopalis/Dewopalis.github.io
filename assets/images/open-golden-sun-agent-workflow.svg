<text x="998" y="861" font-size="17" class="muted">Isolated builds · agent-operated tests</text>
<text x="48" y="913" font-size="16" class="muted">MODEL KEY  Luna = GPT-6 Luna  ·  Sol = GPT-6.1 Sol  ·  Tools = scripts, test runners &amp; build commands</text>
<rect x="48" y="930" width="1344" height="55" rx="7" class="tool"/>
<text x="70" y="965" font-size="18" class="">DEFAULT: coordinator + 2 workers → reviewer takes a freed slot</text>
<text x="1000" y="965" font-size="17" class="">MAX: 4 active, coordinator included</text>
<text x="48" y="1019" font-size="17" class="muted">Leads activate on demand · tools before models · higher effort only for a concrete risk</text>
<text x="48" y="1044" font-size="15" class="muted">github.com/Dewopalis/Open-Golden-Sun</text>
<text x="1020" y="1044" font-size="15" class="muted">Role map, not a live activity report</text>
